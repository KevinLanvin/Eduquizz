[build]
  command = "node tools/build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The built files have a content hash in their name: cache them for a long time.
# index.html must always be revalidated so a new deployment is picked up.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
